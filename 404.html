<!DOCTYPE html>
<html lang="en">

<!--
  GitHub Pages shows this page for any address on the site that doesn't exist
  (a typo, an old link, a page I removed). Built from _templates/one-off.html.
-->

<head>
  <meta charset="utf-8">
  <!-- Every relative path below (css/, media/, js/, the home link) starts from the live site's
       root, so the page looks right at any bad address, like /old/page, and also when I open
       the file straight from my computer. (So a preview uses the live site's CSS, not my local edits.) -->
  <base href="https://raleighcommunitykickstand.org/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Search engines shouldn't list the "not found" page -->
  <meta name="robots" content="noindex">

  <!-- icons -->
  <link rel="icon" type="image/png" href="media/icons/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="media/icons/favicon.svg" />
  <link rel="shortcut icon" href="media/icons/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="media/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="RCK" />
  <link rel="manifest" href="media/icons/site.webmanifest" />

  <title>Page Not Found | Raleigh Community Kickstand</title>

  <!-- Bootstrap 5.3.8 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!-- my styles: colors + fonts first, then the shared site look -->
  <link href="css/theme.css" rel="stylesheet">
  <link href="css/site.css" rel="stylesheet">
</head>

<body>

  <!-- navbar: logo goes back home -->
  <nav class="navbar navbar-expand-lg bg-rck-grey-dark" id="mainNav" data-bs-theme="dark">
    <div class="container px-3">
      <a class="navbar-brand" href="./">
        <img class="brand-logo pe-1 pe-lg-3" src="media/logos/logo-rck-circle-black-yellow.svg" alt="RCK logo">
        Raleigh Community Kickstand
      </a>
    </div>
  </nav>

  <div class="my-wide-container">

    <!-- teal banner with a pixel-art bike on each side -->
    <header class="bg-rck-teal">
      <div class="container">
        <div class="row py-5">
          <div class="col-3 d-flex justify-content-center align-items-center">
            <img src="media/bike.gif" class="header-icon" alt="">
          </div>
          <div class="col-6 mx-0 text-center d-flex flex-column justify-content-center">
            <h1 class="m-0 mb-2">Page Not Found</h1>
            <p class="m-0 p-0">looks like this one got a flat</p>
          </div>
          <div class="col-3 d-flex justify-content-center align-items-center">
            <img src="media/bike-flipped.gif" class="header-icon" alt="">
          </div>
        </div>
      </div>
    </header>

    <section class="bg-rck-light-2">
      <div class="container text-center">
        <p class="m-0"><a href="./">Back to the homepage</a></p>
      </div>
    </section>

  </div>

  <footer class="py-3 bg-rck-grey-dark">
    <div class="container">
      <p class="m-0 text-center text-white small">Copyright &copy; 2026 Raleigh Community Kickstand</p>
    </div>
  </footer>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<!--
  Starter for a one-off page (event, fundraiser, sign-up, etc.).
  To use it: copy this file to the site root (e.g. /alleycat.html), change everything marked
  CHANGE ME, and replace the placeholder sections. This folder starts with "_" so GitHub Pages
  doesn't publish it.

  Paths start with "/" so they work wherever the page ends up.
  Styling comes from /css/theme.css (colors + fonts) and /css/site.css (navbar, banner, type,
  helpers). If a page needs extra styles, I add a small <style> block or a css/<page>.css file.
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="CHANGE ME: one sentence about this page.">

  <!-- icons -->
  <link rel="icon" type="image/png" href="/media/icons/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/media/icons/favicon.svg" />
  <link rel="shortcut icon" href="/media/icons/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/media/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="RCK" />
  <link rel="manifest" href="/media/icons/site.webmanifest" />

  <title>CHANGE ME | Raleigh Community Kickstand</title>

  <!-- link previews (Facebook, iMessage, Slack, etc.) -->
  <meta property="og:site_name" content="Raleigh Community Kickstand">
  <meta property="og:type" content="website">
  <meta property="og:title" content="CHANGE ME | Raleigh Community Kickstand">
  <meta property="og:description" content="CHANGE ME: one sentence about this page.">
  <meta property="og:url" content="https://raleighcommunitykickstand.org/CHANGE-ME">
  <meta property="og:image" content="https://raleighcommunitykickstand.org/media/share-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Raleigh Community Kickstand logo with the words Fix. Teach. Give.">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Bootstrap 5.3.8 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!-- my styles: colors + fonts first, then the shared site look -->
  <link href="/css/theme.css" rel="stylesheet">
  <link href="/css/site.css" rel="stylesheet">
</head>

<body>

  <!-- navbar: logo goes back home -->
  <nav class="navbar navbar-expand-lg bg-rck-grey-dark" id="mainNav" data-bs-theme="dark">
    <div class="container px-3">
      <a class="navbar-brand" href="/">
        <img class="brand-logo pe-1 pe-lg-3" src="/media/logos/logo-rck-circle-black-yellow.svg" alt="RCK logo">
        Raleigh Community Kickstand
      </a>
    </div>
  </nav>

  <div class="my-wide-container">

    <!-- teal banner with a pixel-art bike on each side -->
    <header class="bg-rck-teal">
      <div class="container">
        <div class="row py-5">
          <div class="col-3 d-flex justify-content-center align-items-center">
            <img src="/media/bike.gif" class="header-icon" alt="">
          </div>
          <div class="col-6 mx-0 text-center d-flex flex-column justify-content-center">
            <h1 class="m-0 mb-2">CHANGE ME: Page Title</h1>
            <p class="m-0 p-0">CHANGE ME: short tagline</p>
          </div>
          <div class="col-3 d-flex justify-content-center align-items-center">
            <img src="/media/bike-flipped.gif" class="header-icon" alt="">
          </div>
        </div>
      </div>
    </header>

    <!-- main content on the light yellow background -->
    <section class="bg-rck-light-2">
      <div class="container">

        <h2>CHANGE ME: Section heading</h2>
        <p>CHANGE ME: text. Links look like <a href="/">this</a>.</p>

        <!-- text + photo side by side (stacks on phones) -->
        <div class="row my-3 align-items-stretch">
          <div class="col-lg-7 order-2 order-lg-1">
            <p>CHANGE ME: text next to the photo.</p>
          </div>
          <div class="col-lg-5 d-flex justify-content-center ps-0 ps-lg-3 image-col order-1 order-lg-2">
            <img src="/media/photos/img-3451.webp" alt="CHANGE ME: describe the photo"
              class="img-fluid rounded shadow-rck-depth side-img">
          </div>
        </div>

      </div>
    </section>

  </div>

  <footer class="py-3 bg-rck-grey-dark">
    <div class="container">
      <p class="m-0 text-center text-white small">Copyright &copy; 2026 Raleigh Community Kickstand</p>
    </div>
  </footer>

  <!-- Bootstrap JS (only needed for things like the navbar collapse or dropdowns) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>

</html>

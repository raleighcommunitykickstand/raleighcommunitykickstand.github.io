name: Update Google Calendar

on:
  workflow_dispatch:

  schedule:
    - cron: "34 */12 * * *"

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download Google Calendar ICS
        env:
          CALENDAR_URL: "https://calendar.google.com/calendar/ical/hq05amnbaa5pr0u7ulc2v2ic44%40group.calendar.google.com/public/full.ics"
        run: |
          mkdir -p data

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            "$CALENDAR_URL" \
            --output data/calendar.ics.tmp

          grep -q "BEGIN:VCALENDAR" data/calendar.ics.tmp

      - name: Check for meaningful calendar changes
        id: calendar_diff
        run: |
          python <<'PY'
          from pathlib import Path

          def unfold(text):
              text = text.replace("\r\n", "\n").replace("\r", "\n")

              lines = text.splitlines()
              result = []

              for line in lines:
                  if line.startswith((" ", "\t")) and result:
                      result[-1] += line[1:]
                  else:
                      result.append(line)

              return result


          def normalize(path):
              lines = unfold(Path(path).read_text(encoding="utf-8"))

              header = []
              events = []
              current_event = None

              for line in lines:

                  if line == "BEGIN:VEVENT":
                      current_event = []

                  elif line == "END:VEVENT":
                      # DTSTAMP changes every time Google exports the calendar.
                      current_event = [
                          line
                          for line in current_event
                          if not line.startswith("DTSTAMP:")
                      ]

                      events.append("\n".join(current_event))
                      current_event = None

                  elif current_event is not None:
                      current_event.append(line)

                  elif line != "END:VCALENDAR":
                      header.append(line)

              # Google returns events in arbitrary order.
              events.sort()

              return (
                  "\n".join(header)
                  + "\n"
                  + "\n".join(
                      f"BEGIN:VEVENT\n{event}\nEND:VEVENT"
                      for event in events
                  )
                  + "\nEND:VCALENDAR\n"
              )


          old_path = Path("data/calendar.ics")
          new_path = Path("data/calendar.ics.tmp")

          if not old_path.exists():
              changed = True
          else:
              changed = normalize(old_path) != normalize(new_path)

          with open("/tmp/calendar_changed", "w") as f:
              f.write("true" if changed else "false")
          PY

          echo "changed=$(cat /tmp/calendar_changed)" >> "$GITHUB_OUTPUT"

      - name: Save updated calendar
        if: steps.calendar_diff.outputs.changed == 'true'
        run: |
          mv data/calendar.ics.tmp data/calendar.ics

      - name: Commit calendar
        if: steps.calendar_diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/calendar.ics
          git commit -m "Update calendar"
          git push

name: Update Google Calendar

on:
  workflow_dispatch:

  schedule:
    - cron: "34 * * * *"

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download Google Calendar ICS
        env:
          CALENDAR_URL: "https://calendar.google.com/calendar/ical/hq05amnbaa5pr0u7ulc2v2ic44%40group.calendar.google.com/public/full.ics"
        run: |
          mkdir -p data

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            "$CALENDAR_URL" \
            --output data/calendar.ics.tmp

          grep -q "BEGIN:VCALENDAR" data/calendar.ics.tmp

      - name: Check for meaningful calendar changes
        id: calendar_diff
        run: |
          normalize_ics() {
            sed \
              -e 's/\r$//' \
              -e '/^DTSTAMP:/d' \
              "$1"
          }

          # No existing calendar = definitely new
          if [ ! -f data/calendar.ics ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          normalize_ics data/calendar.ics > /tmp/calendar-old.ics
          normalize_ics data/calendar.ics.tmp > /tmp/calendar-new.ics

          if cmp -s /tmp/calendar-old.ics /tmp/calendar-new.ics; then
            echo "No meaningful calendar changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Calendar content changed:"
            diff -u /tmp/calendar-old.ics /tmp/calendar-new.ics || true
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Replace calendar
        if: steps.calendar_diff.outputs.changed == 'true'
        run: |
          mv data/calendar.ics.tmp data/calendar.ics

      - name: Commit calendar
        if: steps.calendar_diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/calendar.ics
          git commit -m "Update calendar"
          git push

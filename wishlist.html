    <link rel="shortcut icon" href="/media/icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/media/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="RCK" />
    <link rel="manifest" href="/media/icons/site.webmanifest" />

    <!-- link previews (Facebook, iMessage, Slack, etc.) for when I send the link to someone -->
    <meta property="og:site_name" content="Raleigh Community Kickstand">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Wishlist Sign-Up | Raleigh Community Kickstand">

    <link href="css/theme.css" rel="stylesheet">
    <link href="css/site.css" rel="stylesheet">

    <style>
        /* The navbar on top, then the form filling the rest of the screen */
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh; /* phones: the visible height, not counting the browser's address bar */
        }

        .wishlist-form {
            flex: 1;
            width: 100%;
            border: none;

    <nav class="navbar navbar-expand-lg bg-rck-grey-dark" id="mainNav" data-bs-theme="dark">

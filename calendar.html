<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>

    <!-- icon for browser -->
    <link rel="icon" type="image/png" href="/media/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/media/favicon.svg" />
    <link rel="shortcut icon" href="/media/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/media/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="RCK" />
    <link rel="manifest" href="/media/site.webmanifest" />

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- FullCalendar structure -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/skeleton.css" rel="stylesheet">
    <!-- FullCalendar Bootstrap theme -->
    <link href="https://cdn.jsdelivr.net/npm/@fullcalendar/bootstrap5@7.0.2/theme.css" rel="stylesheet">
    <!-- Your CSS LAST -->
    <link href="style.css" rel="stylesheet">
    <link href="calendar.css" rel="stylesheet">
    <!-- iCalendar parser -->
    <script src="https://unpkg.com/ical.js@2.2.1/dist/ical.es5.min.cjs"></script>
    <!-- FullCalendar -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/all/global.js"></script>
    <!-- FullCalendar Bootstrap theme -->
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/bootstrap5@7.0.2/global.js"></script>
    <!-- FullCalendar iCalendar -->
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/icalendar@7.0.2/global.js"></script>

</head>

<body class="calendar-page-body">

    <!-- navbar header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" id="mainNav">
        <div class="container px-3">
            <a class="navbar-brand" href="index.html">
                <img class="brand-logo pe-1 pe-lg-3" src="media/RCK_by.png" alt="RCK logo">
                Raleigh Community Kickstand
            </a>
        </div>
    </nav>


    <div id="partnerPopover" class="partner-popover-root" hidden></div>
    <div id="event-modal" class="event-modal hidden" aria-hidden="true">
        <div class="event-modal-backdrop"></div>

        <div class="event-modal-card" role="dialog" aria-modal="true" aria-labelledby="event-modal-title">
            <button id="event-modal-close" class="event-modal-close" type="button" aria-label="Close">
                ×
            </button>

            <img id="event-modal-image" class="event-modal-image hidden" alt="" />

            <div class="event-modal-body">
                <p id="event-modal-date" class="event-modal-kicker"></p>
                <h3 id="event-modal-title" class="event-modal-title"></h3>
                <p id="event-modal-location" class="event-modal-location"></p>
                <div id="event-modal-description" class="event-modal-description"></div>
                <div id="event-modal-links" class="event-modal-links"></div>
            </div>
        </div>
    </div>

    <main class="container bg-primary calendar-page">

        <header class="calendar-page-header text-center">
            <h1 class="calendar-page-title">Upcoming Events</h1>
        </header>

        <div class="calendar-shell">
            <div id="calendar"></div>
        </div>

        <div class="dropdown mt-3 text-center">
            <button class="btn btn-outline-primary dropdown-toggle" type="button" data-bs-toggle="dropdown"
                aria-expanded="false">
                Subscribe to Calendar
            </button>
            <ul class="dropdown-menu">
                <li>
                    <a class="dropdown-item"
                        href="https://calendar.google.com/calendar/u/0?cid=aHEwNWFtbmJhYTVwcjB1N3VsYzJ2MmljNDRAZ3JvdXAuY2FsZW5kYXIuZ29vZ2xlLmNvbQ"
                        target="_blank" rel="noopener noreferrer">
                        Google Calendar
                    </a>
                </li>
                <li>
                    <a class="dropdown-item"
                        href="https://calendar.google.com/calendar/ical/aHEwNWFtbmJhYTVwcjB1N3VsYzJ2MmljNDRAZ3JvdXAuY2FsZW5kYXIuZ29vZ2xlLmNvbQ/public/basic.ics">
                        Apple Calendar / Outlook / Other (.ics)
                    </a>
                </li>
            </ul>
        </div>

    </main>

    <script src="calendar.js"></script>

</body>

</html>

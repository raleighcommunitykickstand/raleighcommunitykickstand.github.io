<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>
    <!-- link previews (Facebook, iMessage, Slack, etc.) -->
    <meta property="og:site_name" content="Raleigh Community Kickstand">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Upcoming Events | Raleigh Community Kickstand">
    <meta property="og:description" content="Free bike repair events, community shop hours, and rides from Raleigh Community Kickstand.">
    <meta property="og:url" content="https://raleighcommunitykickstand.org/calendar">
    <meta property="og:image" content="https://raleighcommunitykickstand.org/media/share-card.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Raleigh Community Kickstand logo with the words Fix. Teach. Give.">
    <meta name="twitter:card" content="summary_large_image">

    <!-- icon for browser -->
    <link rel="icon" type="image/png" href="/media/icons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/media/icons/favicon.svg" />
    <link rel="shortcut icon" href="/media/icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/media/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="RCK" />
    <link rel="manifest" href="/media/icons/site.webmanifest" />

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet" integrity="sha384-CK2SzKma4jA5H/MXDUU7i1TqZlCFaD4T01vtyDFvPlD97JQyS+IsSh1nI2EFbpyk" crossorigin="anonymous">
    <!-- FullCalendar structure -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/skeleton.css" rel="stylesheet" integrity="sha384-K5GILDUGPQFec0+PkoAk0hS02tO0vHA6dQJkUaFgWS8BcbPYIjdbl1Gmd9dmwX1c" crossorigin="anonymous">
    <!-- FullCalendar Bootstrap theme -->
    <link href="https://cdn.jsdelivr.net/npm/@fullcalendar/bootstrap5@7.0.2/theme.css" rel="stylesheet" integrity="sha384-nyVrSJeIBCXnGRFUFFm8nr/oMDn7cLH9GTmj7mGfR1rh20EvUWjOX1cfRVgJKAkl" crossorigin="anonymous">
    <!-- Your CSS LAST -->
    <link href="css/theme.css" rel="stylesheet">
    <link href="css/site.css" rel="stylesheet">
    <link href="css/calendar.css" rel="stylesheet">
    <!-- iCalendar parser -->
    <script src="https://unpkg.com/ical.js@2.2.1/dist/ical.es5.min.cjs" integrity="sha384-ju8ozm4ZyuCTzjb4fvLmPUASX0zfc5jLOvyN9wadLx23y965jxfdbKTPMIeLrliP" crossorigin="anonymous"></script>
    <!-- FullCalendar -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/all/global.js" integrity="sha384-VOBPyldKwKRFHmpOO0HhaDPzmZvV9B1YWOgHYV6e9gzklIm9Q0u4nHIEBPTrRSh6" crossorigin="anonymous"></script>
    <!-- FullCalendar Bootstrap theme -->
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/bootstrap5@7.0.2/global.js" integrity="sha384-s/BGdAmn07ZVdeOaO/vQ5ECjyU4NI+4VqKei6mdyR7ntlFO8ZOGnafjTTGIfWboG" crossorigin="anonymous"></script>
    <!-- FullCalendar iCalendar -->
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/icalendar@7.0.2/global.js" integrity="sha384-o7n3dKCv5LaHDkEk4ETdWIjVk/U8VezuYYtNaVRL1VsjGhIovpfv8IEwmdUPW7nI" crossorigin="anonymous"></script>

</head>

<body class="calendar-page-body">

    <!-- navbar header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-rck-grey-dark" id="mainNav">
        <div class="container px-3">
            <a class="navbar-brand" href="index.html">
                <img class="brand-logo pe-1 pe-lg-3" src="media/logos/logo-rck-circle-black-yellow.svg" alt="RCK logo">
                Raleigh Community Kickstand
            </a>
        </div>
    </nav>


    <div id="event-modal" class="event-modal hidden" aria-hidden="true">
        <div class="event-modal-backdrop"></div>

        <div class="event-modal-card" role="dialog" aria-modal="true" aria-labelledby="event-modal-title">
            <button id="event-modal-close" class="event-modal-close" type="button" aria-label="Close">
                ×
            </button>

            <div class="event-modal-body">
                <p id="event-modal-date" class="event-modal-kicker"></p>
                <h3 id="event-modal-title" class="event-modal-title"></h3>
                <p id="event-modal-location" class="event-modal-location"></p>
                <div id="event-modal-description" class="event-modal-description"></div>
                <div id="event-modal-links" class="event-modal-links"></div>
            </div>
        </div>
    </div>

    <main class="container bg-rck-light-2 calendar-page">

        <header class="calendar-page-header text-center">
            <h1 class="calendar-page-title">Upcoming Events</h1>
        </header>

        <div class="calendar-shell">
            <div id="calendar"></div>
        </div>

        <div class="dropdown mt-3 text-center">
            <button class="btn btn-outline-primary dropdown-toggle" type="button" data-bs-toggle="dropdown"
                aria-expanded="false">
                Subscribe to Calendar
            </button>
            <ul class="dropdown-menu">
                <li>
                    <a class="dropdown-item"
                        href="https://calendar.google.com/calendar/u/0?cid=aHEwNWFtbmJhYTVwcjB1N3VsYzJ2MmljNDRAZ3JvdXAuY2FsZW5kYXIuZ29vZ2xlLmNvbQ"
                        target="_blank" rel="noopener noreferrer">
                        Google Calendar
                    </a>
                </li>
                <li>
                    <a class="dropdown-item"
                        href="https://calendar.google.com/calendar/ical/hq05amnbaa5pr0u7ulc2v2ic44%40group.calendar.google.com/public/basic.ics">
                        Apple Calendar / Outlook / Other (.ics)
                    </a>
                </li>
            </ul>
        </div>

    </main>

    <!-- Bootstrap JS: makes the "Subscribe to Calendar" dropdown open -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    <script src="js/calendar.js"></script>

</body>

</html>

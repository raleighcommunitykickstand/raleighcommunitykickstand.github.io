<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calendar</title>

  <!-- FullCalendar -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/all/global.js"></script>

  <!-- Google Calendar plugin -->
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/google-calendar@7.0.2/global.min.js"></script>

  <!-- FullCalendar styling -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/skeleton.css">

  <style>
    #calendar {
      max-width: 1100px;
      margin: 40px auto;
    }
  </style>
</head>

<body>

  <div id="calendar"></div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const calendarEl = document.getElementById("calendar");

      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',

        events: {
          url: 'https://calendar.google.com/calendar/ical/hq05amnbaa5pr0u7ulc2v2ic44%40group.calendar.google.com/public/full.ics',
          format: 'ics'
        }
      });

      calendar.render();
    });
  </script>

</body>

</html>
